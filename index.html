  <style>
    :root {
      --wine: #2a0a24;
      --plum: #4b1347;
      --coral: #ff4d7d;
      --blush: #ffe8ef;
      --gold: #ffc857;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--blush);
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 77, 125, 0.34), transparent 45%),
        radial-gradient(circle at 88% 92%, rgba(255, 200, 87, 0.18), transparent 42%),
        linear-gradient(160deg, var(--plum), var(--wine) 60%);
      background-attachment: fixed;
    }

    /* ---------- Soft hearts floating in the background ---------- */
    .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

    .ambient span {
      position: absolute;
      bottom: -60px;
      color: var(--coral);
      opacity: 0;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.22; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; }
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: 28px 28px 24px;
      text-align: center;
      border-radius: 36px;
      background: rgba(255, 232, 239, 0.08);
      border: 1px solid rgba(255, 232, 239, 0.2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      font-size: 1.25rem;
      color: #fff;
      background: var(--coral);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(255, 77, 125, 0.5);
    }

    #lang {
      padding: 8px 12px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--blush);
      background: rgba(255, 232, 239, 0.1);
      border: 1px solid rgba(255, 232, 239, 0.3);
      border-radius: 12px;
      cursor: pointer;
    }

    #lang option { color: var(--wine); background: var(--blush); }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 6vw, 2.3rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 1.05rem;
      color: rgba(255, 232, 239, 0.8);
    }

    /* ---------- The heart ---------- */
    .heart-wrap {
      position: relative;
      width: 250px;
      height: 225px;
      margin: 0 auto 18px;
    }

    .heart-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 22px rgba(255, 77, 125, 0.45));
    }

    .heart-wrap.idle svg     { animation: beat 1.6s ease-in-out infinite; }
    .heart-wrap.thinking svg { animation: beat 0.7s ease-in-out infinite; }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.06); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.04); }
    }

    .wave { animation: drift 2.2s linear infinite; }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(-100px); }
    }

    .score {
      position: absolute;
      inset: 0 0 auto 0;
      top: 34%;
      direction: ltr;
      font-size: 3.4rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 12px rgba(42, 10, 36, 0.55);
      pointer-events: none;
    }

    /* ---------- Form ---------- */
    .names {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: end;
    }

    .field { text-align: start; }

    .amp {
      padding-bottom: 12px;
      font-size: 1.8rem;
      color: var(--coral);
      animation: beat 1.6s ease-in-out infinite;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font: inherit;
      font-size: 1.1rem;
      color: var(--wine);
      background: var(--blush);
      border: 2px solid transparent;
      border-radius: 16px;
    }

    input[type="text"]::placeholder { color: rgba(74, 20, 69, 0.5); }
    input[type="text"][aria-invalid="true"] { border-color: var(--gold); }
    input[type="text"]:disabled { opacity: 0.65; }

    .error {
      min-height: 1.4em;
      margin: 10px 0 6px;
      text-align: start;
      font-size: 0.95rem;
      color: var(--gold);
    }

    button {
      width: 100%;
      padding: 14px 18px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ff6a93, #ff2e63);
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 46, 99, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: wait; }

    .secondary {
      background: transparent;
      box-shadow: none;
      border: 2px solid rgba(255, 232, 239, 0.4);
    }

    .secondary:hover:not(:disabled) { background: rgba(255, 232, 239, 0.12); filter: none; }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    /* ---------- Analyzing status ---------- */
    .status {
      min-height: 1.5em;
      margin: 14px 0 0;
      font-weight: 500;
      color: var(--gold);
    }

    /* ---------- Result ---------- */
    .result { margin-top: 16px; }

    .result-title {
      margin: 0 0 2px;
      font-size: 1.35rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .result-tag {
      margin: 0 0 12px;
      font-weight: 600;
      color: var(--gold);
    }

    .flames {
      display: inline-block;
      margin: 0 0 6px;
      padding: 8px 18px;
      font-weight: 600;
      background: rgba(255, 200, 87, 0.14);
      border: 1px solid rgba(255, 200, 87, 0.45);
      border-radius: 999px;
    }

    .flames-note {
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: rgba(255, 232, 239, 0.65);
    }

    .result-reading {
      margin: 0;
      color: rgba(255, 232, 239, 0.9);
      line-height: 1.55;
    }

    .breakdown {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      text-align: start;
    }

    .row {
      display: grid;
      grid-template-columns: 120px 1fr 46px;
      align-items: center;
      gap: 10px;
    }

    .track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 232, 239, 0.15);
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff8fab, #ff2e63);
      transition: width 1s ease-out;
    }

    .value { direction: ltr; text-align: end; font-weight: 600; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .copy-status {
      min-height: 1.3em;
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: var(--gold);
    }

    .note {
      margin: 18px 0 0;
      font-size: 0.85rem;
      color: rgba(255, 232, 239, 0.6);
    }

    .credit {
      margin: 10px 0 0;
      padding-top: 14px;
      font-size: 0.95rem;
      border-top: 1px solid rgba(255, 232, 239, 0.16);
      color: rgba(255, 232, 239, 0.8);
    }

    .owner {
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    /* ---------- Floating hearts for high scores ---------- */
    .confetti {
      position: fixed;
      bottom: -40px;
      z-index: 10;
      pointer-events: none;
      animation: rise linear forwards;
    }

    @keyframes rise {
      to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }

    @media (max-width: 540px) {
      .card { padding: 22px 18px 20px; border-radius: 28px; }
      .names { grid-template-columns: 1fr; gap: 10px; }
      .amp { display: none; }
      .row { grid-template-columns: 100px 1fr 44px; }
      .actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-wrap.idle svg, .heart-wrap.thinking svg, .wave, .amp { animation: none; }
      .confetti, .ambient { display: none; }
      button, .fill { transition: none; }
    }
  </style>
</head>

            <stop offset="1" stop-color="#ff2e63"/>

        <!-- empty heart -->
        <path d="M50 85 C20 62 5 45 5 28 C5 14 16 5 29 5 C38 5 46 10 50 17 C54 10 62 5 71 5 C84 5 95 14 95 28 C95 45 80 62 50 85 Z"

        <!-- outline and shine -->
        <path d="M50 85 C20 62 5 45 5 28 C5 14 16 5 29 5 C38 5 46 10 50 17 C54 10 62 5 71 5 C84 5 95 14 95 28 C95 45 80 62 50 85 Z"

      <div class="score" id="score" aria-hidden="true">?</div>

    <form id="loveForm" novalidate>

      </div>

      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="calcBtn" data-i18n="calc">Calculate love score</button>
    </form>

    <p class="status" id="status" aria-live="polite"></p>

    <section class="result" id="result" aria-live="polite" hidden>
      <p class="result-title" id="resultTitle"></p>
      <p class="result-tag" id="resultTag"></p>

      <p class="flames" id="flames"></p>
      <p class="flames-note" id="flamesNote"></p>

      <p class="result-reading" id="resultReading"></p>

      <div class="breakdown" id="breakdown"></div>

      <div class="actions">
        <button type="button" class="secondary" id="copyBtn" data-i18n="copy">Copy result</button>
        <button type="button" class="secondary" id="waBtn" data-i18n="whatsapp">Send on WhatsApp</button>
        <button type="button" class="secondary" id="saveBtn" data-i18n="save">Save picture</button>

      <p class="copy-status" id="copyStatus" aria-live="polite"></p>

    <p class="note" data-i18n="note">Just for fun. This is not a real prediction.</p>

    <p class="credit">
      <span data-i18n="credit">Created with love by</span>
      <span class="owner">ALADDIN</span> <span aria-hidden="true">♥</span>

    const CATEGORY_KEYS = ["trust", "romance", "fun", "longterm"];
    const TIER_EMOJI = ["💞", "💖", "✨", "🔥"];
    const FLAMES_EMOJI = ["🤝", "💖", "🥰", "💍", "⚡", "👫"];

    // Replaces {a}, {b}, {n} ... inside a sentence.
    function fill(text, vars) {
      return text.replace(/\{(\w+)\}/g, function (match, key) {
        return key in vars ? vars[key] : match;
      });
    }

    // Turns text into a number. The same text always gives the same number.
    function fnv(text) {
      let h = 0x811c9dc5;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return h >>> 0;
    }

    // "  Amina  ", "amina" and "Âmina" count as the same name.
    function normalize(text) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f\u064b-\u065f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function tidy(text) {
      return text.trim().replace(/\s+/g, " ");
    }

    // Used to check that the two names are not the same person.
    function sameName(a, b) {
      return normalize(a).replace(/\s/g, "") === normalize(b).replace(/\s/g, "");
    }

    function hasLetter(text) {
      return /\p{L}/u.test(text);
    }

    function tierIndex(score) {
      if (score >= 90) return 0;
      if (score >= 75) return 1;
      if (score >= 50) return 2;
      return 3;
    }

    function calculate(nameA, nameB) {
      // Sorting means "Daniel + Amina" and "Amina + Daniel" give the same score.
      const pair = [normalize(nameA), normalize(nameB)].sort().join("|");

      const score = 30 + (fnv(pair) % 71);                       // 30 to 100

      const parts = CATEGORY_KEYS.map(function (key) {
        const offset = (fnv(pair + "#" + key) % 21) - 10;        // -10 to +10
        const value = Math.max(15, Math.min(100, score + offset));
        return { key: key, value: value };
      });

      let best = parts[0];
      parts.forEach(function (p) { if (p.value > best.value) best = p; });

      return { score: score, parts: parts, best: best };
    }

    // The classic FLAMES game: Friends, Love, Affection, Marriage, Enemies, Siblings.
    // Letters the two names share cancel each other out, then the letters
    // that are left decide which word is crossed out each round.
    function flamesFor(nameA, nameB) {
      const lettersA = Array.from(normalize(nameA)).filter(function (ch) { return /\p{L}/u.test(ch); });
      const lettersB = Array.from(normalize(nameB)).filter(function (ch) { return /\p{L}/u.test(ch); });

      const available = {};
      lettersB.forEach(function (ch) { available[ch] = (available[ch] || 0) + 1; });

      let common = 0;
      lettersA.forEach(function (ch) {
        if (available[ch] > 0) { available[ch] -= 1; common += 1; }
      });

      const left = lettersA.length + lettersB.length - 2 * common;

      // Names made of exactly the same letters leave nothing: a perfect match.
      if (left === 0) return { index: 1, left: 0 };

      const list = [0, 1, 2, 3, 4, 5];
      let position = 0;
      while (list.length > 1) {
        position = (position + left - 1) % list.length;
        list.splice(position, 1);
      }
      return { index: list[0], left: left };
    }

    /* ---------- Heart animation ---------- */

    // The heart's inside runs from y = 85 (bottom tip) to y = 5 (top).
    function setLevel(percent) {
      const y = 85 - (percent / 100) * 80;

    }

    function animateTo(score) {
      return new Promise(function (resolve) {
        if (reduceMotion) {
          setLevel(score);
          scoreText.textContent = score + "%";
          resolve();
          return;
        }

        const duration = 2200;
        const start = performance.now();

        function frame(now) {
          const t = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);          // slows down near the end
          setLevel(eased * score);
          scoreText.textContent = Math.round(eased * score) + "%";

          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    /* ---------- Picture to save and share ---------- */
    function fitText(ctx, text, maxWidth, startSize, weight) {
      let size = startSize;
      ctx.font = weight + " " + size + "px " + FONT;
      while (ctx.measureText(text).width > maxWidth && size > 24) {
        size -= 2;
        ctx.font = weight + " " + size + "px " + FONT;
      }

    async function savePicture() {
      const text = T();
      const d = lastData;
      if (!d) return;

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const W = 1080, H = 1350;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const score = d.result.score;
        const tier = tierIndex(score);

        ctx.direction = lang === "ar" ? "rtl" : "ltr";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Background
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, "#4b1347");
        bg.addColorStop(1, "#2a0a24");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        const glow = ctx.createRadialGradient(200, 150, 10, 200, 150, 700);
        glow.addColorStop(0, "rgba(255,77,125,0.40)");
        glow.addColorStop(1, "rgba(255,77,125,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);

        // Title
        ctx.fillStyle = "#ffe8ef";
        fitText(ctx, text.title, 900, 56, 700);
        ctx.fillText(text.title, W / 2, 110);

        // Heart that is filled up to the score
        const heart = new Path2D(HEART_PATH);
        ctx.save();
        ctx.translate(140, 190);
        ctx.scale(8, 8);
        ctx.fillStyle = "rgba(255,255,255,0.10)";
        ctx.fill(heart);

        ctx.save();
        ctx.clip(heart);
        const level = 85 - (score / 100) * 80;
        const liquidFill = ctx.createLinearGradient(0, level, 0, 85);
        liquidFill.addColorStop(0, "#ff8fab");
        liquidFill.addColorStop(1, "#ff2e63");
        ctx.fillStyle = liquidFill;
        ctx.fillRect(0, level, 100, 100);
        ctx.restore();

        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#ffe8ef";
        ctx.stroke(heart);
        ctx.restore();

        // Score inside the heart
        ctx.direction = "ltr";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(42,10,36,0.6)";
        ctx.shadowBlur = 24;
        ctx.font = "700 170px " + FONT;
        ctx.fillText(score + "%", W / 2, 470);
        ctx.shadowBlur = 0;
        ctx.direction = lang === "ar" ? "rtl" : "ltr";

        // Names
        const names = d.a + " + " + d.b;
        ctx.fillStyle = "#ffe8ef";
        fitText(ctx, names, 920, 74, 700);
        ctx.fillText(names, W / 2, 1010);

        // Tier
        ctx.fillStyle = "#ffc857";
        fitText(ctx, TIER_EMOJI[tier] + " " + text.tiers[tier], 900, 52, 600);
        ctx.fillText(TIER_EMOJI[tier] + " " + text.tiers[tier], W / 2, 1100);

        // FLAMES
        ctx.fillStyle = "#ffe8ef";
        const flamesLine = FLAMES_EMOJI[d.flames.index] + " " + text.flamesTitle + ": " + text.flames[d.flames.index];
        fitText(ctx, flamesLine, 900, 44, 500);
        ctx.fillText(flamesLine, W / 2, 1180);

        // Owner credit
        ctx.fillStyle = "#ffc857";
        const credit = text.credit + " ALADDIN";
        fitText(ctx, credit, 900, 38, 600);
        ctx.fillText(credit, W / 2, 1275);

        canvas.toBlob(function (blob) {
          if (!blob) { copyStatus.textContent = text.saveFail; return; }
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "love-score.png";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
          copyStatus.textContent = text.saved;
          setTimeout(function () { copyStatus.textContent = ""; }, 3000);
        }, "image/png");
      } catch (err) {
        copyStatus.textContent = text.saveFail;
      }
    }

    /* ---------- Events ---------- */
    form.addEventListener("submit", async function (event) {

      if (!hasLetter(nameA)) { showError(text.errLetters, [yourInput], yourInput); return; }
      if (!hasLetter(nameB)) { showError(text.errLetters, [loverInput], loverInput); return; }

      const result = calculate(nameA, nameB);
      const flames = flamesFor(nameA, nameB);

      for (let i = 0; i < 3; i++) {
        statusBox.textContent = T().analyzing[i];
        await sleep(900);
      }
      statusBox.textContent = "";

      heartWrap.classList.remove("thinking");
      await animateTo(result.score);

      lastData = { a: nameA, b: nameB, result: result, flames: flames };
      renderResult(true);
      if (result.score >= 75) launchHearts();
      setBusy(false);
    });

    [yourInput, loverInput].forEach(function (input) {
      input.addEventListener("input", function () {
        yourInput.removeAttribute("aria-invalid");
        loverInput.removeAttribute("aria-invalid");
        errorBox.textContent = "";
      });
    });

    anotherBtn.addEventListener("click", function () {
      yourInput.value = "";
      loverInput.value = "";
      lastData = null;
      resultBox.hidden = true;
      statusBox.textContent = "";
      copyStatus.textContent = "";
      setLevel(0);
      scoreText.textContent = "?";
      heartWrap.classList.add("idle");
      yourInput.focus();
    });

    copyBtn.addEventListener("click", async function () {
      if (!lastData) return;
      const message = shareMessage();

      let copied = false;
      try {
        await navigator.clipboard.writeText(message);
        copied = true;
      } catch (err) {
        // Fallback for browsers that block the clipboard on local files.
        const temp = document.createElement("textarea");
        temp.value = message;
        document.body.appendChild(temp);
        temp.select();
        try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
        temp.remove();
      }

      copyStatus.textContent = copied ? T().copied : T().copyFail;
      setTimeout(function () { copyStatus.textContent = ""; }, 3000);
    });

    waBtn.addEventListener("click", function () {
      if (!lastData) return;
      window.open("https://wa.me/?text=" + encodeURIComponent(shareMessage()), "_blank", "noopener");
    });

    saveBtn.addEventListener("click", savePicture);

    /* ---------- Start ---------- */
    lang = detectLanguage();
    applyLanguage();
    buildAmbientHearts();
  </script>
</body>
</html>
